[project]
name = "valor"
version = "0.1.0"
description = "Agentic second-line enterprise valuation reviewer (prototype, mock data)"
requires-python = ">=3.11"
dependencies = [
  "dash==3.1.1",
  "plotly>=5.20",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "python-docx>=1.1",
  "markdown>=3.5",
  "formulas>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["valor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
